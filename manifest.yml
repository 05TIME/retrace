modules:
  rovo:agent:
    - key: retrace-agent
      name: Retrace Triage
      description: Triages Jira issues and records every decision as a replayable,
        hash-chained trace.
      prompt: resource:agent-prompt;agent.txt
      conversationStarters:
        - Triage the newest issue and record a trace
        - Replay the trace for this issue and verify it
        - What if this issue were labelled security?
      actions:
        - find-issues
        - triage-issue
        - replay-trace
        - what-if-trace
      skills:
        - retrace-triage
  rovo:mcp:
    - key: retrace-mcp
      name: Retrace MCP
      tools:
        - find-issues
        - triage-issue
        - replay-trace
        - what-if-trace
  rovo:skill:
    - key: retrace-triage
      source:
        dir: skills/retrace-triage
      dependencies:
        tools:
          - find-issues
          - triage-issue
          - replay-trace
          - what-if-trace
  action:
    - key: find-issues
      name: Find recent issues
      function: find-fn
      actionVerb: GET
      description: Lists real Jira issue keys and summaries, newest first, using a
        JQL search. Use this before triage whenever the exact issue key is not known.
      inputs:
        project:
          title: Project key
          type: string
          required: false
          description: Optional Jira project key to restrict the search, for example MOBL.
        text:
          title: Text
          type: string
          required: false
          description: Optional words to match in the issue summary or description.
        maxResults:
          title: Max results
          type: integer
          required: false
          description: How many issues to return (1-20, default 10).
    - key: triage-issue
      name: Triage issue with trace
      function: triage-fn
      actionVerb: GET
      description: Suggests priority, labels and assignee for a Jira issue using a
        deterministic scorer, and stores a hash-chained trace.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example PROJ-123.
        seed:
          title: Seed
          type: integer
          required: false
          description: Optional RNG seed. Defaults to a value derived from the issue key.
    - key: replay-trace
      name: Replay triage trace
      function: replay-fn
      actionVerb: GET
      description: Re-executes the stored trace for an issue and verifies every step
        hash matches. Returns verdict verified or mismatch.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key.
    - key: what-if-trace
      name: What-if triage rerun
      function: whatif-fn
      actionVerb: GET
      description: Reruns triage on the stored trace with changed inputs (added or removed
        labels, a forced priority, or advanced JSON overrides) using the same seed,
        and returns a before/after diff. Nothing is stored.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key.
        addLabels:
          title: Add labels
          type: string
          required: false
          description: Comma-separated labels to pretend the issue has, for example security,outage.
        removeLabels:
          title: Remove labels
          type: string
          required: false
          description: Comma-separated labels to pretend are removed. Removed labels are also not re-detected from the issue text.
        forcePriority:
          title: Force priority
          type: string
          required: false
          description: Optional priority to pin instead of scoring. One of Highest, High, Medium, Low, Lowest.
        overridesJson:
          title: Advanced overrides (JSON)
          type: string
          required: false
          description: 'Optional JSON object of fields to override: summary, description, labels, components, issueType, forcePriority. Example {"summary":"Checkout is down"}.'
  jira:issuePanel:
    - key: retrace-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Retrace
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:issueContext:
    - key: retrace-context
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Retrace
      label: Retrace trace
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: find-fn
      handler: actions/index.findIssuesHandler
    - key: triage-fn
      handler: actions/index.triageHandler
    - key: replay-fn
      handler: actions/index.replayHandler
    - key: whatif-fn
      handler: actions/index.whatIfHandler
    - key: resolver
      handler: resolvers/index.handler
resources:
  - key: panel
    path: src/frontend/index.tsx
  - key: agent-prompt
    path: prompts
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/2b9b66b6-b31e-4dcd-810f-9b73f6cf9015
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
